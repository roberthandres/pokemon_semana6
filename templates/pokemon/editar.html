
<h1>Editar Pokémon</h1>

<form method="POST">
    {% csrf_token %}

    <label>Nombre:</label>
    <input type="text" name="nombre" value="{{ pokemon.nombre }}" required>

    <label>Peso:</label>
    <input type="number" step="any" name="peso" value="{{ pokemon.peso }}" required>

    <label>Naturaleza:</label>
    <input type="text" name="naturaleza" value="{{ pokemon.naturaleza }}">

    <label>Elemento:</label>
    <input type="text" name="elemento" value="{{ pokemon.elemento }}">

    <label>Habilidades:</label>
    <textarea name="habilidades">{{ pokemon.habilidades }}</textarea>

    <label>Descripción:</label>
    <textarea name="descripcion">{{ pokemon.descripcion }}</textarea>

    <label>Imagen:</label>
    <input type="url" name="imagen" value="{{ pokemon.imagen|default:'' }}">

    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'lista_pokemones' %}">Volver</a>

```html
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #101827, #1e293b);
        color: #f1f5f9;
        min-height: 100vh;
        padding: 40px 20px;
    }

    h1 {
        text-align: center;
        color: #facc15;
        font-size: 2.2rem;
        margin-bottom: 30px;
        text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }

    form {
        max-width: 600px;
        margin: 0 auto;
        padding: 35px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 600;
        color: #cbd5e1;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        font-size: 15px;
        font-family: inherit;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #facc15;
        box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.15);
    }

    button {
        width: 100%;
        margin-top: 28px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #facc15, #eab308);
        color: #1e293b;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(250, 204, 21, 0.25);
    }

    .volver {
        display: block;
        width: fit-content;
        margin: 25px auto 0;
        padding: 12px 25px;
        border: 1px solid #64748b;
        border-radius: 10px;
        color: #cbd5e1;
        text-decoration: none;
        transition: background 0.3s, color 0.3s;
    }

    .volver:hover {
        background: #334155;
        color: #facc15;
    }

    @media (max-width: 600px) {
        body {
            padding: 25px 15px;
        }

        form {
            padding: 25px 20px;
        }

        h1 {
            font-size: 1.8rem;
        }
    }
</style>
